<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>FleetView — 선대 현지시간·연락가능 모니터</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="" />
<style>
  :root{
    --bg:#0b1622; --panel:#101f30; --panel2:#16283d; --line:#22384f;
    --text:#e8eef5; --muted:#8ca2b8; --accent:#3fb6ff;
    --contact:#25d07d; --offhrs:#5b6b7d;
    --live:#25d07d; --dr:#f2b134; --stale:#ff6b6b;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;font-family:-apple-system,"Segoe UI","Malgun Gothic","Apple SD Gothic Neo",sans-serif;background:var(--bg);color:var(--text)}
  #app{display:flex;height:100vh;overflow:hidden}
  #sidebar{width:360px;flex:0 0 360px;background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column}
  #map{flex:1;background:#08111c}
  header{padding:14px 16px;border-bottom:1px solid var(--line)}
  header h1{margin:0;font-size:16px;letter-spacing:.3px}
  header .sub{margin-top:3px;font-size:11px;color:var(--muted)}
  .stats{display:flex;gap:6px;padding:10px 12px;border-bottom:1px solid var(--line)}
  .stat{flex:1;background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:8px 4px;text-align:center}
  .stat b{display:block;font-size:18px}
  .stat span{font-size:10px;color:var(--muted)}
  .stat.contact{background:rgba(37,208,125,.12);border-color:var(--contact)}
  .stat.contact b{color:var(--contact)}
  .stat.off b{color:var(--offhrs)}
  .toolbar{padding:8px 12px;border-bottom:1px solid var(--line);display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  .toolbar input[type=text]{flex:1;min-width:140px;background:var(--panel2);border:1px solid var(--line);color:var(--text);border-radius:6px;padding:6px 8px;font-size:12px}
  .toolbar label{font-size:11px;color:var(--muted);display:flex;align-items:center;gap:4px;cursor:pointer;user-select:none}
  .list{overflow:auto;flex:1}
  .row{padding:10px 12px;border-bottom:1px solid var(--line);cursor:pointer;display:flex;gap:10px;align-items:flex-start}
  .row:hover{background:var(--panel2)}
  .dot{width:9px;height:9px;border-radius:50%;margin-top:5px;flex:0 0 9px}
  .dot.live{background:var(--live)} .dot.dr{background:var(--dr)} .dot.stale{background:var(--stale)}
  .row .name{font-size:13px;font-weight:600}
  .row .meta{font-size:11px;color:var(--muted);margin-top:2px;line-height:1.5}
  .rt{text-align:right;flex:0 0 auto}
  .clock{font-size:15px;color:var(--accent);font-variant-numeric:tabular-nums;font-weight:600}
  .pill{display:inline-block;font-size:10px;font-weight:700;padding:2px 7px;border-radius:20px;margin-top:3px}
  .pill.on{background:var(--contact);color:#04120a}
  .pill.off{background:transparent;border:1px solid var(--offhrs);color:var(--offhrs)}
  .badge{font-size:9px;padding:1px 5px;border-radius:4px;border:1px solid var(--line);color:var(--muted)}
  footer{padding:8px 12px;font-size:10px;color:var(--muted);border-top:1px solid var(--line);line-height:1.6}
  .legend{position:absolute;z-index:500;right:10px;bottom:10px;background:rgba(16,31,48,.92);border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:11px}
  .legend div{display:flex;align-items:center;gap:6px;margin:2px 0}
  .legend .sw{width:10px;height:10px;border-radius:50%}
  .leaflet-popup-content-wrapper{background:var(--panel);color:var(--text);border:1px solid var(--line)}
  .leaflet-popup-tip{background:var(--panel)}
  .pop b{color:var(--accent)}
  .pop table{font-size:12px;border-collapse:collapse;margin-top:4px}
  .pop td{padding:1px 6px 1px 0;color:var(--muted)} .pop td.v{color:var(--text)}
  .est{color:var(--dr);font-size:11px}
  .ring{filter:drop-shadow(0 0 3px var(--contact))}
</style>
</head>
<body>
<div id="app">
  <div id="sidebar">
    <header>
      <h1>&#9875; FleetView — WSM Korea</h1>
      <div class="sub">선박 현지시간(Local Time) · 09:00~18:00 <b style="color:var(--contact)">연락가능</b> 표기 · 추정위치(DR)</div>
    </header>
    <div class="stats">
      <div class="stat contact"><b id="nContact">0</b><span>📞 연락가능</span></div>
      <div class="stat off"><b id="nOff">0</b><span>업무시간외</span></div>
      <div class="stat live"><b id="nLive">0</b><span>실측&lt;6h</span></div>
      <div class="stat"><b id="nEst">0</b><span>추정</span></div>
    </div>
    <div class="toolbar">
      <input id="search" type="text" placeholder="선명 / MMSI / IMO 검색" />
      <label><input type="checkbox" id="onlyContact" /> 연락가능만</label>
    </div>
    <div class="list" id="list"></div>
    <footer>
      <div id="updated">데이터 로딩 중…</div>
      <div><b style="color:var(--contact)">연락가능</b> = 선박 현지시각 09:00–18:00. 현지시간은 경도 기반 항해표준시(추정)이며, 정확 위치 업무(PSC·사고조사)에는 사용 금지.</div>
    </footer>
  </div>
  <div id="map"></div>
  <div class="legend">
    <div><span class="sw" style="background:var(--contact)"></span> 연락가능 (09–18시 현지)</div>
    <div><span class="sw" style="background:var(--live)"></span> 실측 (AIS &lt; 6h)</div>
    <div><span class="sw" style="background:var(--dr)"></span> 추정 (6–24h)</div>
    <div><span class="sw" style="background:var(--stale)"></span> 장기추정 (&gt; 24h)</div>
  </div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
<script>
const CONFIG = { dataUrl:"data/fleet.json", refreshMs:30000, reloadMs:5*60*1000,
  liveHours:6, drHours:24, uncertaintyRatio:0.10, contactStart:9, contactEnd:18 };

const R_NM = 3440.065;
const toRad = d => d*Math.PI/180, toDeg = r => r*180/Math.PI;
function deadReckon(lat, lon, cogDeg, distNM){
  const d = distNM/R_NM, br = toRad(cogDeg), p1=toRad(lat), l1=toRad(lon);
  const p2 = Math.asin(Math.sin(p1)*Math.cos(d)+Math.cos(p1)*Math.sin(d)*Math.cos(br));
  const l2 = l1 + Math.atan2(Math.sin(br)*Math.sin(d)*Math.cos(p1), Math.cos(d)-Math.sin(p1)*Math.sin(p2));
  return [toDeg(p2), ((toDeg(l2)+540)%360)-180];
}
function nauticalTZ(lon){ return Math.round(lon/15); }
function localTimeAt(lon, date){
  const tz = nauticalTZ(lon);
  const utcMs = date.getTime() + date.getTimezoneOffset()*60000;
  const loc = new Date(utcMs + tz*3600000);
  const hh = String(loc.getHours()).padStart(2,"0");
  const mm = String(loc.getMinutes()).padStart(2,"0");
  const sign = tz>=0?"+":"−";
  return { text:hh+":"+mm, hour:loc.getHours()+loc.getMinutes()/60, tz:"UTC"+sign+Math.abs(tz) };
}
function ageHours(iso){ return (Date.now()-new Date(iso).getTime())/3600000; }
function statusOf(h){ return h<CONFIG.liveHours?"live":h<CONFIG.drHours?"dr":"stale"; }
const STATUS_KO = { live:"실측", dr:"추정", stale:"장기추정" };
const cssVar = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const STATUS_COLOR = { live:cssVar('--live'), dr:cssVar('--dr'), stale:cssVar('--stale') };
const CONTACT_COLOR = cssVar('--contact');

const map = L.map('map',{worldCopyJump:true,zoomControl:true}).setView([20,90],3);
L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png',{
  attribution:'&copy; OpenStreetMap &copy; CARTO', subdomains:'abcd', maxZoom:12 }).addTo(map);

let FLEET=[], layers={};
function computeVessel(v){
  const h = ageHours(v.timestamp), st = statusOf(h);
  let pos=[v.lat,v.lon], est=false;
  if(st!=="live" && (v.sog||0)>0.3){ pos=deadReckon(v.lat,v.lon,v.cog==null?0:v.cog,v.sog*h); est=true; }
  const loc = localTimeAt(pos[1], new Date());
  const contactable = loc.hour>=CONFIG.contactStart && loc.hour<CONFIG.contactEnd;
  const uncNM = est ? Math.max(2, v.sog*h*CONFIG.uncertaintyRatio) : 0;
  return Object.assign({}, v, { h, st, pos, est, loc, contactable, uncNM });
}
function draw(){
  let nContact=0,nOff=0,nLive=0,nEst=0; const rows=[];
  FLEET.map(computeVessel).forEach(c=>{
    if(c.contactable)nContact++; else nOff++;
    if(c.st==="live")nLive++; if(c.est)nEst++;
    const col = STATUS_COLOR[c.st];
    let L1=layers[c.mmsi];
    if(!L1){
      const marker=L.circleMarker(c.pos,{radius:6,weight:2}).addTo(map);
      const ring=L.circleMarker(c.pos,{radius:10,weight:2,fill:false,color:CONTACT_COLOR,className:'ring'});
      const circle=L.circle(c.pos,{radius:0,color:col,weight:1,dashArray:"4 4",fill:false});
      marker.on('click',()=>focusVessel(c.mmsi));
      L1=layers[c.mmsi]={marker,ring,circle};
    }
    L1.marker.setLatLng(c.pos).setStyle({color:col,fillColor:col,fillOpacity:c.est?0.35:0.9});
    // 연락가능 = 초록 링 강조
    L1.ring.setLatLng(c.pos);
    if(c.contactable){ if(!map.hasLayer(L1.ring))L1.ring.addTo(map); }
    else if(map.hasLayer(L1.ring)){ map.removeLayer(L1.ring); }
    if(c.uncNM>0){ L1.circle.setLatLng(c.pos).setRadius(c.uncNM*1852).setStyle({color:col});
      if(!map.hasLayer(L1.circle))L1.circle.addTo(map);
    } else if(map.hasLayer(L1.circle)){ map.removeLayer(L1.circle); }
    L1.marker.bindPopup(popupHtml(c));
    rows.push(c);
  });
  document.getElementById('nContact').textContent=nContact;
  document.getElementById('nOff').textContent=nOff;
  document.getElementById('nLive').textContent=nLive;
  document.getElementById('nEst').textContent=nEst;
  renderList(rows);
}
function popupHtml(c){
  const pill = c.contactable?'<span class="pill on">📞 연락가능</span>':'<span class="pill off">업무시간외</span>';
  return '<div class="pop"><b>'+c.name+'</b> <span class="badge">'+STATUS_KO[c.st]+'</span> '+pill
    +'<table>'
    +'<tr><td>현지시각</td><td class="v"><b style="font-size:14px">'+c.loc.text+'</b> <span style="color:var(--muted)">'+c.loc.tz+'</span></td></tr>'
    +'<tr><td>MMSI / IMO</td><td class="v">'+c.mmsi+' / '+(c.imo||'—')+'</td></tr>'
    +'<tr><td>위치</td><td class="v">'+fmtCoord(c.pos[0],'NS')+', '+fmtCoord(c.pos[1],'EW')+' '+(c.est?'<span class="est">(추정)</span>':'')+'</td></tr>'
    +'<tr><td>SOG / COG</td><td class="v">'+(c.sog==null?0:c.sog).toFixed(1)+' kn / '+Math.round(c.cog==null?0:c.cog)+'°</td></tr>'
    +'<tr><td>목적지</td><td class="v">'+(c.destination||'—')+'</td></tr>'
    +'<tr><td>마지막 AIS</td><td class="v">'+fmtAge(c.h)+' 전</td></tr>'
    +'</table></div>';
}
function renderList(rows){
  const q=(document.getElementById('search').value||'').toLowerCase();
  const only=document.getElementById('onlyContact').checked;
  rows.sort((a,b)=> (b.contactable-a.contactable) || (a.loc.hour-b.loc.hour));
  const html = rows.filter(c=> (!only||c.contactable) && (!q ||
      c.name.toLowerCase().includes(q)||String(c.mmsi).includes(q)||String(c.imo||'').includes(q)))
    .map(c=>'<div class="row" onclick="focusVessel('+c.mmsi+')">'
      +'<div class="dot '+c.st+'"></div>'
      +'<div style="flex:1">'
        +'<div class="name">'+c.name+'</div>'
        +'<div class="meta">'+c.mmsi+' · '+STATUS_KO[c.st]+' · 최종 '+fmtAge(c.h)+' 전 '+(c.est?'· <span class="est">추정</span>':'')+'</div>'
        +'<div class="meta">→ '+(c.destination||'—')+'</div>'
      +'</div>'
      +'<div class="rt"><div class="clock">'+c.loc.text+'</div>'
        +'<div class="meta">'+c.loc.tz+'</div>'
        +(c.contactable?'<span class="pill on">연락가능</span>':'<span class="pill off">시간외</span>')+'</div>'
    +'</div>').join('');
  document.getElementById('list').innerHTML = html || '<div class="row"><div class="meta">해당 선박 없음</div></div>';
}
window.focusVessel=function(mmsi){
  const c=computeVessel(FLEET.find(v=>v.mmsi===mmsi));
  map.setView(c.pos,6,{animate:true}); layers[mmsi].marker.openPopup();
};
function fmtCoord(v,ax){ const h=v>=0?ax[0]:ax[1]; return Math.abs(v).toFixed(3)+'°'+h; }
function fmtAge(h){ if(h<1)return Math.round(h*60)+'분'; if(h<48)return h.toFixed(1)+'시간'; return Math.round(h/24)+'일'; }

async function load(){
  try{
    const r=await fetch(CONFIG.dataUrl+'?t='+Date.now(),{cache:'no-store'});
    if(!r.ok)throw new Error(r.status);
    const j=await r.json(); FLEET=j.vessels||j;
    document.getElementById('updated').innerHTML='데이터 기준: <b>'+(j.generatedAt?new Date(j.generatedAt).toLocaleString('ko-KR'):'샘플')+'</b> · 선박 '+FLEET.length+'척';
  }catch(e){
    FLEET=SAMPLE.vessels;
    document.getElementById('updated').innerHTML='⚠ 실데이터 없음 — <b>내장 샘플</b> 표시 중 ('+FLEET.length+'척)';
  }
  draw();
  if(!load._fitted && FLEET.length){
    const g=L.featureGroup(Object.values(layers).map(l=>l.marker));
    try{ map.fitBounds(g.getBounds().pad(0.2)); }catch(e){}
    load._fitted=true;
  }
}
document.getElementById('search').addEventListener('input',()=>draw());
document.getElementById('onlyContact').addEventListener('change',()=>draw());
setInterval(draw,CONFIG.refreshMs); setInterval(load,CONFIG.reloadMs);

const hoursAgo=h=>new Date(Date.now()-h*3600000).toISOString();
const SAMPLE={generatedAt:new Date().toISOString(),vessels:[
 {mmsi:440371000,name:"ASIAN CAPTAIN",imo:9158616,lat:35.1,lon:129.04,sog:0.1,cog:0,destination:"KRPUS Busan",timestamp:hoursAgo(0.3)},
 {mmsi:441947000,name:"ASIAN MAJESTY",imo:9203576,lat:1.26,lon:103.8,sog:12.5,cog:90,destination:"SGSIN Singapore",timestamp:hoursAgo(1.1)},
 {mmsi:538005333,name:"MORNING CHANT",imo:9663300,lat:25.3,lon:55.3,sog:0.2,cog:0,destination:"AEJEA Jebel Ali",timestamp:hoursAgo(2.5)},
 {mmsi:441093000,name:"MORNING CHORUS",imo:9312834,lat:51.9,lon:4.1,sog:9.0,cog:270,destination:"BEZEE Zeebrugge",timestamp:hoursAgo(3.0)},
 {mmsi:372914000,name:"MORNING CONDUCTOR",imo:9336050,lat:36.9,lon:-76.3,sog:16.0,cog:80,destination:"USBAL Baltimore",timestamp:hoursAgo(5.2)},
 {mmsi:356473000,name:"MORNING LADY",imo:9445980,lat:34.4,lon:135.2,sog:14.0,cog:180,destination:"JPUKB Kobe",timestamp:hoursAgo(9.0)},
 {mmsi:235011580,name:"MORNING CONCERT",imo:9312822,lat:-33.9,lon:18.4,sog:15.5,cog:60,destination:"ZADUR Durban",timestamp:hoursAgo(27)}
]};
load();
</script>
</body>
</html>
