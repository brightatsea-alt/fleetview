name: Update AIS positions

on:
  schedule:
    - cron: "0 * * * *"      # 매시 정각 (UTC). 실제로는 5~15분 지연될 수 있음
  workflow_dispatch:          # 수동 실행 버튼

permissions:
  contents: write

concurrency:
  group: update-ais
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install deps
        working-directory: collector
        run: npm install --no-audit --no-fund

      - name: Collect AIS data
        working-directory: collector
        env:
          AISSTREAM_API_KEY: ${{ secrets.AISSTREAM_API_KEY }}
          LISTEN_SECONDS: "170"
        run: node fetch-ais.js

      - name: Commit updated data
        run: |
          git config user.name  "fleetview-bot"
          git config user.email "actions@github.com"
          git add data/fleet.json
          if git diff --staged --quiet; then
            echo "변경 없음"
          else
            git commit -m "chore: update AIS positions ($(date -u +'%Y-%m-%d %H:%M UTC'))"
            git push
          fi
